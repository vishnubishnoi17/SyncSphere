services:
  - type: web
    name: syncsphere-server
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false        # Your Vercel frontend URL
      - key: CLIENT_ORIGINS
        sync: false        # Usually the same as CLIENT_URL; comma-separate extra origins
    healthCheckPath: /health
