name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build client and server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build server
        working-directory: server
        env:
          DATABASE_URL: postgresql://syncsphere:syncsphere@localhost:5432/syncsphere
          JWT_SECRET: ci-jwt-secret-with-more-than-thirty-two-characters
          REFRESH_TOKEN_SECRET: ci-refresh-secret-with-more-than-thirty-two-characters
        run: npm run build
